<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Scale</title>

<!-- Icon inline as an SVG data URI, on purpose.
     A separate /favicon.ico would be one more HTTP request, and this link loses
     anywhere from 0 to 100 % of its packets - requests are the expensive thing
     here, not bytes. This costs about 460 bytes inside a page that gzips to
     about 6.5 kB.

     The badge is Near-Black Tile 1, so it reads on both light and dark browser
     chrome.

     The mark is the instrument itself, not an abstract glyph. Five candidates
     were rendered and judged at 16, 20, 24, 32 and 48 px on light and dark,
     rather than read off the markup, and three earlier rounds were rejected the
     same way: a load on a bar read as a cone or a bell, a balance beam
     collapsed into a thin cross with invisible pans, and a dial gauge read as a
     pressure gauge, which is a different instrument.

     What makes this one say "scales" is the combination - blue platform across
     the top, body below it, a display window, and two feet. Platform and feet
     are the two cues that survive being scaled down to 16 px; the display window
     is what makes it an instrument rather than a box, and the feet are what
     stop it reading as a washing machine. A housing without feet was tried and
     dropped for exactly that reason. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272729'/%3E%3Crect x='5' y='6' width='22' height='3' rx='1.5' fill='%232997ff'/%3E%3Crect x='8' y='11' width='16' height='12' rx='2' fill='%23fff'/%3E%3Crect x='11' y='15' width='10' height='4' rx='.8' fill='%23272729'/%3E%3Crect x='8' y='25' width='5' height='3.5' rx='1.75' fill='%23fff'/%3E%3Crect x='19' y='25' width='5' height='3.5' rx='1.75' fill='%23fff'/%3E%3C/svg%3E">

<!-- Theme applied before the first paint. This has to run in <head>: a script
     at the end of the body would let the light background paint first and then
     flip, which reads as a flash. Two lines, no dependencies. -->
<script>
(function () {
  var t;
  try { t = localStorage.getItem('scale-theme'); } catch (e) { t = null; }
  if (t !== 'dark' && t !== 'light') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Tokens are copied verbatim from DESIGN.md, which is an extracted Apple design
   system. Editing them here means editing the design system, not the page. */
:root{
  --primary:#0066cc;          /* Action Blue, the single accent */
  --primary-focus:#0071e3;
  --primary-on-dark:#2997ff;  /* Sky Link Blue, dark surfaces only */
  --canvas:#ffffff;
  --parchment:#f5f5f7;
  --tile:#272729;             /* Near-Black Tile 1 */
  --ink:#1d1d1f;
  --muted80:#333333;
  --muted48:#6e6e73;
  --hairline:#e0e0e0;
  --soft:#f0f0f0;
  --pill:9999px; --sm:8px; --md:11px; --lg:18px;
  --product-shadow:0 3px 30px rgba(0,0,0,.22);

  /* Chip colours live here because they need to change with the theme, and a
     bare opacity on the element dims the border as well as the text. */
  --chip-off:#9a9aa0;
  --chip-off-line:rgba(255,255,255,.30);
  --chip-on:#2997ff;
  --chip-on-line:#2997ff;

  /* Tooltips invert against the page so they read the same way in both themes:
     dark bubble on the light page, light bubble on the dark one. */
  --tip-bg:#1d1d1f;
  --tip-fg:#ffffff;
}

/* Night mode. Only the roles change - no component rule below knows which theme
 * it is in, which is the whole point of doing it through custom properties.
 *
 * Every value is a token DESIGN.md already contains. Pure Black is documented
 * as "reserved for true void", Tile 2 as a micro-step lighter than Tile 1, Body
 * On Dark as the text tone on dark surfaces and Body Muted (#cccccc) as
 * secondary copy there. Nothing new was invented for the dark palette.
 *
 * --primary deliberately stays Action Blue. It is the fill under white button
 * text, and white on Sky Link Blue is 3.02:1 - a fail. Sky Link Blue is used
 * for TEXT on dark surfaces, which is precisely what the design system says it
 * is for: "for dark surfaces where Action Blue would disappear". */
:root[data-theme="dark"]{
  --canvas:#000000;           /* Pure Black */
  --parchment:#2a2a2c;       /* Near-Black Tile 2 */
  --tile:#1c1c1e;            /* a shade below Tile 1, for the hero to sit forward */
  --ink:#ffffff;             /* Body On Dark */
  --muted80:#cccccc;         /* Body Muted */
  --muted48:#98989d;
  --hairline:#3a3a3c;
  --soft:#262628;
  --chip-off:#8e8e93;
  --chip-off-line:rgba(255,255,255,.20);
  --chip-on:#2997ff;
  --chip-on-line:#2997ff;
  --tip-bg:#f5f5f7;
  --tip-fg:#1d1d1f;
  /* The focus ring has to stay visible on black; Focus Blue at 2.6:1 on white
     becomes 3.4:1 here, which is enough for a non-text indicator. */
  --primary-focus:#2997ff;
}

/* The hero tile is the product render and is dark in BOTH themes, so the theme
   only changes the page around it. That follows DESIGN.md's "photography-first
   presentation, UI recedes": the dark tile with the reading on it is the one
   element that does not move. */

*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{
  font-family:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;
  font-weight:400;
  font-size:17px;
  line-height:1.47;
  letter-spacing:-0.374px;
  background:var(--canvas);color:var(--ink);
}

/* DESIGN.md: the global nav is the only true-black element on most pages. */
.nav{
  background:#000;height:44px;display:flex;align-items:center;
  justify-content:center;position:relative;
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:12px;line-height:1;letter-spacing:-.12px;color:#fff;
}
/* Absolutely positioned so the title stays truly centred no matter how wide the
   toggle is - the alternative, padding the bar to make room, shifts the title
   whenever the glyph changes. The nav is Pure Black in both themes and the glyph
   is white on it, so neither needs a theme rule. */
.nav-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;padding:0;border:0;border-radius:var(--pill);
  background:transparent;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.nav-toggle svg{width:17px;height:17px;display:block}
.nav-toggle:hover{background:rgba(255,255,255,.12)}
.nav-toggle:focus-visible{outline:2px solid #2997ff;outline-offset:1px}
.nav-toggle .ico-moon{display:block}
.nav-toggle .ico-sun{display:none}
:root[data-theme="dark"] .nav-toggle .ico-moon{display:none}
:root[data-theme="dark"] .nav-toggle .ico-sun{display:block}

/* Full-bleed tiles, never rounded. The colour change IS the divider, so there
   must be no gap and no border between them. */
.tile{width:100%;padding:80px 24px;text-align:center}
.tile-dark{background:var(--tile);color:#fff}
.tile-parchment{background:var(--parchment)}

.tagline{
  font-family:system-ui,-apple-system,sans-serif;font-weight:600;
  font-size:21px;line-height:1.19;letter-spacing:.231px;opacity:.6;
}

/* The weight is the product render: it is the one element DESIGN.md allows a
   shadow on, and it must dominate the viewport. */
/* NB: letter-spacing MUST NOT go inside the font shorthand. It is not one of the
   properties font accepts, so a shorthand carrying it is dropped wholesale and
   the element silently falls back to Times New Roman 16px. Individual
   properties keep the rule readable and, more importantly, visible. */
.hero{
  display:inline-block;margin:16px auto 0;
  font-family:"SF Pro Display",system-ui,-apple-system,sans-serif;
  font-weight:600;
  font-size:88px;
  line-height:1.02;
  letter-spacing:-1.8px;
  text-shadow:var(--product-shadow);
  /* Tabular figures keep digit widths stable while the value updates 2.5x per
     second; without it the readout jitters sideways. */
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
.hero-unit{
  font-family:system-ui,-apple-system,sans-serif;
  font-weight:600;
  font-size:24px;
  line-height:1.19;
  letter-spacing:.231px;
  opacity:.55;margin-left:12px;
}

.chips{margin-top:40px;display:flex;gap:12px;justify-content:center;position:relative}
/* Contrast of the off state used to be white at opacity .4, which measured
   3.63:1 on the tile - under the 4.5:1 floor for 12 px text. Opacity was also
   the wrong mechanism: it dimmed the border along with the text, so the
   outline of an inactive chip was fainter than the outline of an active one.
   Both are now chosen values, and both are theme-aware.
   Note that brightness cannot carry the on/off distinction on its own: the off
   grey is 4.86:1 and the on blue is 4.94:1. The distinction is carried by
   colour and by the border, which is the honest way to do it. */
.chip{
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:12px;line-height:1;letter-spacing:-.12px;
  padding:7px 14px;border-radius:var(--pill);
  border:1px solid var(--chip-off-line);color:var(--chip-off);
  transition:color .18s,border-color .18s;
  position:relative;
}
.chip.on{border-color:var(--chip-on-line);color:var(--chip-on)}
.chip:focus-visible{outline:2px solid var(--primary-on-dark);outline-offset:2px}
/* Tooltips. Shared by the status chips and the three action buttons, so the
   bubble is defined once. Scoped with .has-tip rather than .btn so that the unit
   buttons and the calibration buttons do not sprout explanations they do not
   need - g, kg and oz speak for themselves.

   A pseudo-element on the element itself rather than a title= attribute: the
   native one is slow to appear, cannot be styled to match the page, and on some
   browsers never appears at all for touch.
   Shown on hover, on keyboard focus, and on tap - .tip-open is set by the
   handler below, because the primary screen for this instrument is a phone and a
   phone has no hover.

   Hidden with display:none, NOT visibility:hidden. A visibility:hidden box is
   still generated, so it still contributes to scrollable overflow, and the
   centred bubbles made the document 11 px wider than a 375 px viewport - a
   horizontal scrollbar on the very phone screen this layout was fitted to. The
   fade is kept by animating opacity across the display change instead. */
.chip::after,.has-tip::after{
  content:attr(data-tip);
  position:absolute;top:calc(100% + 9px);left:50%;
  transform:translateX(-50%);
  z-index:5;
  width:max-content;max-width:min(252px,72vw);
  padding:8px 11px;border-radius:10px;
  background:var(--tip-bg);color:var(--tip-fg);
  font-size:12px;line-height:1.34;letter-spacing:-.12px;font-weight:400;
  text-align:left;white-space:normal;
  box-shadow:0 4px 16px rgba(0,0,0,.28);
  display:none;pointer-events:none;
  /* box-sizing has to be repeated here. The universal selector does NOT match
     pseudo-elements, so the border-box reset above never reaches this bubble and
     it stayed content-box: the 252 px max-width applied to the content alone and
     the 22 px of padding were added on top, making it 274 px. That is 11 px too
     wide on the right for a centred chip, and it put a horizontal scrollbar on
     a 375 px phone screen. Only the centred chips overflowed - the first and
     last anchor to their own edge, so the extra width grew inwards. */
  box-sizing:border-box;
}
.chip:hover::after,.chip:focus-visible::after,.chip.tip-open::after,
.has-tip:hover::after,.has-tip:focus-visible::after,.has-tip.tip-open::after{
  display:block;animation:tip-fade .15s ease both;
}
@keyframes tip-fade{from{opacity:0}to{opacity:1}}
/* The ends of a row anchor to their own edge. A bubble centred on the first or
   last item runs past the edge of the screen, which is how the horizontal
   scrollbar first appeared. Both rows need it: the chips and the actions. */
.chips>:first-child::after,.actions>:first-child::after{left:0;transform:none}
.chips>:last-child::after,.actions>:last-child::after{left:auto;right:0;transform:none}

/* Buttons. Pill radius is the brand action signal; active state is
   scale(0.95) on every one of them. */
.btn{
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:17px;line-height:1;letter-spacing:-0.374px;
  border-radius:var(--pill);padding:11px 22px;border:0;cursor:pointer;
  transition:transform .12s;
  position:relative;   /* the tooltip anchors to this */
}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.label{
  font-family:system-ui,-apple-system,sans-serif;font-weight:600;
  font-size:14px;line-height:1.29;letter-spacing:-.224px;margin-bottom:14px;
}
.units{display:flex;gap:10px;justify-content:center}
.units .btn{padding:9px 20px;font-size:15px}

/* Utility card: hairline border, 18px radius, 24px padding. No shadow. */
.card{
  background:var(--canvas);border:1px solid var(--hairline);
  border-radius:var(--lg);padding:24px;text-align:left;max-width:560px;
  margin:0 auto;
}
/* Disclosure header. A real button, so it is focusable and works from the
   keyboard, with aria-expanded carrying the state for anything that reads it. */
.card-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:0;border:0;background:transparent;cursor:pointer;
  color:var(--ink);text-align:left;
}
.card-toggle:focus-visible{outline:2px solid var(--primary-focus);outline-offset:4px}
.chev{
  width:9px;height:9px;border-right:2px solid var(--muted48);
  border-bottom:2px solid var(--muted48);transform:rotate(-45deg);
  transition:transform .2s;flex:none;margin-right:4px;
}
.card-toggle[aria-expanded="true"] .chev{transform:rotate(45deg)}
.diag-body{display:none}
.diag-body.open{display:block;margin-top:14px}
.kv{
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:14px;line-height:1.43;letter-spacing:-.224px;
  color:var(--muted48);display:flex;justify-content:space-between;
  gap:16px;padding:9px 0;border-bottom:1px solid var(--soft);
}
.kv:last-child{border-bottom:0}
.kv b{font-weight:400;color:var(--muted80);font-variant-numeric:tabular-nums}

/* Calibration panel. Hidden until the operator asks for it; the sequence takes
   about 30 s and needs two physical actions, so it must say which one it is
   waiting for rather than sitting silent. */
.cal-panel{display:none;margin-top:16px}
.cal-panel.open{display:block}
.cal-step{
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:14px;line-height:1.43;letter-spacing:-.224px;
  color:var(--muted80);margin-bottom:14px;
}
.cal-bar{
  height:3px;background:var(--soft);border-radius:2px;overflow:hidden;
  margin-bottom:14px;
}
.cal-bar span{display:block;height:100%;width:0;background:var(--primary);
  transition:width .4s ease}
.cal-input{
  font-family:system-ui,-apple-system,sans-serif;font-size:17px;
  letter-spacing:-0.374px;color:var(--ink);
  padding:10px 14px;border:1px solid var(--hairline);border-radius:var(--md);
  width:120px;text-align:right;font-variant-numeric:tabular-nums;
}
.cal-input:focus{outline:2px solid var(--primary-focus);outline-offset:1px}
.cal-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* A button that reflects a persistent machine state shows that state without
   competing with the primary action. DESIGN.md allows one solid accent per
   screen, and filling a second button in the same row made "Zero" stop
   reading as the primary action. A tinted background with accent text says
   "engaged" just as clearly and leaves the hierarchy intact. */
.btn.state-on{
  background:rgba(0,102,204,.09);color:var(--primary);
  border-color:rgba(0,102,204,.45);
}

footer{
  background:var(--parchment);padding:64px 24px;
  font-family:system-ui,-apple-system,sans-serif;font-weight:400;
  font-size:12px;line-height:1;letter-spacing:-.12px;color:var(--muted48);
  text-align:center;
}
/* Section paddings live here rather than in inline styles, because an inline
   style outranks a stylesheet rule and the phone layout below could not touch
   them - which is exactly why the first attempt overflowed by 104 px on a
   360x640 screen while looking correct in the source. */
.tile-actions{padding:48px 20px}
.tile-plain{padding:48px 20px}
.tile-flush{padding:0 20px 20px}
.tile-foot{padding:0 20px 24px}

/* Phone layout. The goal is the whole instrument on one screen with no
   scrolling, so every value below is tighter than the desktop one rather than a
   copy of it.

   The tightest common phone is 375x667, and that is what this is sized against.
   The hero is still the loudest thing on the page - DESIGN.md's "photography
   first" does not stop applying on a small screen - so the space comes out of
   the section padding and the footer, not out of the reading. */
@media(max-width:640px){
  .tile{padding:26px 16px}
  .tile-actions,.tile-plain{padding:20px 16px}
  .tile-flush{padding:0 16px 16px}
  .tile-foot{padding:0 16px 18px}
  .tagline{font-size:15px}
  .hero{font-size:52px;letter-spacing:-1.4px}
  .hero-unit{font-size:19px;margin-left:8px}
  .chips{margin-top:14px;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;padding:6px 11px}
  .card{padding:16px;border-radius:14px}
  .actions{gap:8px}
  /* Small enough that Zero, Auto-zero and Calibrate stay on one line at 360 px
     wide. Measured: at 16px/18px they wrapped and cost a whole extra row. */
  .btn{padding:9px 14px;font-size:15px}
  .units{gap:8px}
  .units .btn{padding:8px 14px;font-size:14px}
  .kv{font-size:13px;padding:7px 0}
  footer{padding:20px 16px;font-size:11px}
}
/* Narrower still, 320 px wide. Measured: at 15px the three action buttons need
   about 303 px and the five chips about 282, so at a 288 px content box both
   wrapped to a second row and cost 76 px between them. One step smaller keeps
   each on a single line. */
@media(max-width:374px){
  .btn{padding:8px 11px;font-size:14px}
  .chip{font-size:10px;padding:5px 9px}
  .chips{gap:6px}
  .units .btn{padding:7px 11px;font-size:13px}
  footer{padding:16px 12px}
}
</style>
</head>
<body>

<div class="nav">
  <span>ESP32 Scale</span>
  <!-- Two inline SVGs, one shown per theme. A text glyph would be cheaper still,
       but the point of the icon set is that the tab, the favicon and this
       toggle look like the same family. -->
  <button class="nav-toggle" id="theme-toggle" onclick="toggleTheme()"
          aria-label="Switch appearance">
    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/>
    </svg>
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2
               M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6
               M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
    </svg>
  </button>
</div>

<!-- Hero. Weight dominates; everything else is quiet, per DESIGN.md's
     "photography-first presentation, UI recedes". -->
<div class="tile tile-dark">
  <div class="tagline">Precision scale</div>
  <div><span class="hero"><span id="weight">0.00</span><span class="hero-unit" id="unit">g</span></span></div>
  <div class="chips">
    <!-- data-tip carries the explanation. It is shown on hover, on keyboard
         focus and on tap, because a scale gets used on a phone as much as on a
         desk, and a phone has no hover. -->
    <span class="chip" id="chip-stable" tabindex="0"
          data-tip="Platform is quiet — samples stay inside the noise band">STABLE</span>
    <span class="chip" id="chip-zero" tabindex="0"
          data-tip="Nothing on the platform: the reading is inside the deadband">ZERO</span>
    <span class="chip" id="chip-tare" tabindex="0"
          data-tip="A tare is in effect — every weight is relative to it">TARE</span>
    <span class="chip" id="chip-avg" tabindex="0"
          data-tip="Averaging window is full — 45 raw samples behind the figure">AVG</span>
    <span class="chip" id="chip-lock" tabindex="0"
          data-tip="The figure has settled and is latched">HOLD</span>
  </div>
</div>

<!-- Actions live on parchment, which is the colour change acting as divider. -->
<div class="tile tile-parchment tile-actions">
  <div class="actions">
    <button class="btn btn-primary has-tip" onclick="tare()"
            data-tip="Take the tare — every weight is measured from here">Zero</button>
    <button class="btn btn-ghost has-tip" id="btn-azt" onclick="toggleAzt()"
            data-tip="On: the zero follows the platform as it drifts">Auto-zero</button>
    <button class="btn btn-ghost has-tip" onclick="openCal()"
            data-tip="Two-point calibration against a known reference">Calibrate</button>
  </div>
</div>

<div class="tile tile-flush">
  <div class="card cal-panel" id="cal-panel">
    <div class="label">Calibration wizard</div>
    <div class="cal-step" id="cal-step">Press Start, then follow the steps in order.</div>
    <div class="cal-bar"><span id="cal-bar"></span></div>
    <div class="cal-row" id="cal-mass-row">
      <input class="cal-input" id="cal-mass" type="number" step="0.01"
             min="0.1" value="73.03" inputmode="decimal">
      <span style="font-size:14px;color:var(--muted48)">g — reference mass</span>
    </div>
    <div class="cal-row" style="margin-top:14px">
      <button class="btn btn-primary" id="cal-go" onclick="startCal()">Start</button>
      <button class="btn btn-ghost" onclick="calMeasureOnly()">Measure only</button>
    </div>
  </div>
</div>

<div class="tile tile-plain">
  <div class="card">
    <div class="label">Units</div>
    <div class="units">
      <button class="btn btn-ghost" data-code="g"  onclick="setUnit(0)">g</button>
      <button class="btn btn-ghost" data-code="kg" onclick="setUnit(1)">kg</button>
      <button class="btn btn-ghost" data-code="oz" onclick="setUnit(2)">oz</button>
    </div>
  </div>
</div>

<div class="tile tile-flush tile-foot">
  <div class="card">
    <!-- Collapsed by default, for the same reason the calibration panel is: on a
         phone the five rows push everything below them off the screen, and they
         are the one part of the page nobody needs while weighing. Same toggle
         pattern as openCal, deliberately, rather than <details> - one
         disclosure idiom in the page. -->
    <button class="card-toggle" id="diag-toggle" onclick="toggleDiag()"
            aria-expanded="false" aria-controls="diag-body">
      <span class="label" style="margin:0">Diagnostics</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="diag-body" id="diag-body">
      <div class="kv"><span>Raw count</span><b id="d-counts">—</b></div>
      <div class="kv"><span>Noise σ</span><b id="d-sigma">—</b></div>
      <div class="kv"><span>cal_factor</span><b id="d-cal">—</b></div>
      <div class="kv"><span>tare_offset</span><b id="d-tare">—</b></div>
      <div class="kv"><span>Uptime</span><b id="d-up">—</b></div>
    </div>
  </div>
</div>

<footer>ESP32-S3 · HX711 · reference calibration</footer>

<script>
/* Resolution decided 2026-10-07: 0.05 g at rest. The filter can do it, and the
   measured accuracy on a paired measurement is +/-0.04 g, so the readout rounds
   to that rather than showing filter noise as extra digits. */
var step = 0.05;

/* The API speaks Latin codes ("g", "kg", "oz"); the page shows Cyrillic labels.
   Keeping the mapping in one table stops the two drifting apart - comparing the
   raw API string against button text is what left no unit highlighted. */
/* per = how many grams make one unit, so the displayed figure is grams / per.
   The average is kept in grams regardless of what is selected: averaging mixed
   scales inside one window would be meaningless. */
var UNITS = [
  {code: 'g',  label: 'g',  per: 1,            decimals: 2},
  {code: 'kg', label: 'kg', per: 1000,         decimals: 3},
  {code: 'oz', label: 'oz', per: 28.349523125, decimals: 3}
];

var lastUnit = null;
var calTimer = null;
var calPhase = 'idle';

/* The readout shows a running mean, not the instantaneous sample.
 *
 * Measured on a stationary 73.03 g reference: raw sigma is 45 counts = 107 mg,
 * and the mean over 40 s comes out within 0.020 g of the reference. So the
 * weight IS knowable - but only as an average. Showing the instantaneous value,
 * rounded to 0.05 g, made the last digit flicker while the leading digits stayed
 * correct, which reads as an instrument that cannot settle. */
/* Two polls, 3 s - and that is all that is left of the browser-side averaging.
 *
 * This used to be 12 polls, an 18 s window, chosen from a measured curve of
 * sigma against window length. The curve was right and the conclusion drawn from
 * it was wrong: it asked how to average more POLLS, when the polls were the
 * scarce resource.
 *
 * The device samples at 11.3 Hz. The browser polls once every 1.5 s. So each
 * poll throws away seventeen raw samples, and a 12 poll window is twelve numbers
 * stretched over eighteen seconds - while the same 45 raw samples are available
 * to the device in four seconds, where averaging them costs nothing because
 * nobody has to wait for a network round trip.
 *
 * Measured: raw sigma 110 mg, so the mean of 45 raw samples has a standard error
 * of 110/sqrt(45) = 16 mg. The 18 s window was buying about 15 mg. Same answer,
 * a quarter of the time.
 *
 * Note what this does NOT buy: a trustworthy 0.01 g digit. At 16 mg the last
 * digit is still noise-dominated. The hold (HOLD) is what makes the figure
 * steady, and the honest resolution of this instrument remains 0.05 g. */
var AVG_N = 2;
var hist = [];

/* Hold the reading once it has settled.
 *
 * Averaging cannot explain why the figure never stops moving. Measured: the noise
 * of one raw sample is 107 mg, so averaging does reduce it, but the resting point
 * still wanders by ~0.6 g peak to peak over minutes. That wander is NOT a drift: a
 * ten minute measurement gives a trend of +3 mg/min and a total shift of -3 counts
 * (see AGENTS.md). It is a random walk, so the window mean follows the platform as
 * surely as it follows the load, and no window length removes it. Latching does.
 *
 * A real scale answers this by latching the figure once it is steady, which is
 * what these constants implement: hold after LOCK_HOLD consecutive readings
 * within LOCK_TOL of each other, release on anything beyond LOCK_RELEASE. That
 * release width is far larger than any plausible drift, so a genuine weight
 * change always gets through.
 *
 * The hold is also released when the instrument reports zero. Inside the deadband
 * the firmware snaps the anchor to the reading, so the authoritative value is
 * exactly zero, and a frozen figure would then show something the instrument does
 * not believe. The consequence is that an empty platform shows a live 0.00 with
 * the hold indicator off, which is intended: there is nothing to latch. */
var LOCK_TOL     = 0.03;   /* g: must exceed the step of the window mean */
var LOCK_RELEASE = 0.5;    /* g: certainly a different weight */
var LOCK_HOLD    = 3;      /* consecutive polls inside the tolerance */
var locked = false, lockedValue = 0, quiet = 0, candidate = null;

function unitInfo(code) {
  for (var i = 0; i < UNITS.length; i++) {
    if (UNITS[i].code === code) return UNITS[i];
  }
  return UNITS[0];
}

function resetAverage() { hist = []; locked = false; quiet = 0; candidate = null; }

/* Day / night.
 *
 * The choice is kept in localStorage rather than in the device. It costs nothing
 * on the firmware and needs no flash; the price is that it is tied to this
 * browser and this origin, so a different DHCP lease on the instrument would
 * lose it and fall back to the system preference.
 *
 * localStorage can throw, not only when it is full but when the page is opened
 * in a context that forbids it. A scale on a bench is the sort of thing that
 * gets opened from odd places, so the failure is caught and the theme still
 * switches for the session. */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  var b = document.getElementById('theme-toggle');
  if (b) b.setAttribute('aria-label', t === 'dark' ? 'Switch to day' : 'Switch to night');
}

function toggleTheme() {
  var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('scale-theme', t); } catch (e) { /* session only */ }
}

/* Returns the figure to display, in grams. */
function holdOrShow(grams, stable) {
  if (candidate === null) {
    candidate = grams;
  }
  if (locked) {
    if (Math.abs(grams - lockedValue) > LOCK_RELEASE) {
      locked = false;
      quiet = 0;
      candidate = grams;
    } else {
      return lockedValue;
    }
  }
  if (Math.abs(grams - candidate) <= LOCK_TOL) {
    quiet++;
  } else {
    quiet = 0;
    candidate = grams;
  }
  if (quiet >= LOCK_HOLD && stable) {
    locked = true;
    lockedValue = grams;
  }
  return locked ? lockedValue : grams;
}

function meanValue(v) {
  /* Kept only to smooth the last couple of polls. The real averaging happens in
   * the device now - see the note above AVG_N. */
  hist.push(v);
  if (hist.length > AVG_N) hist.shift();
  var sum = 0;
  for (var i = 0; i < hist.length; i++) sum += hist[i];
  return {v: sum / hist.length, n: hist.length};
}

function paint(s) {
  var u = unitInfo(s.unit);

  /* Average in grams, then convert into the selected unit. The conversion was
     missing here: the comment described it but no divide existed, so switching
     to kg or oz changed only the label while the digits stayed in grams. */
  /* The device asserting zero outranks everything this page computes.
   *
   * Inside the deadband the firmware snaps the anchor to the reading, so when
   * zero is reported the authoritative figure is exactly 0. Averaging the zero in
   * with samples taken before the deadband engaged leaves a residue on screen -
   * measured as 0.02 g with the zero indicator lit - and the hold then latches
   * that residue, so it never clears. Measured over 66 polls: the device reports
   * a non-zero value while zero is set in zero cases out of 66, so the whole
   * effect comes from this averaging window and nothing upstream.
   *
   * So zero bypasses the window entirely rather than joining it. */
  var m, shown;
  if (s.zero) {
    resetAverage();
    m = {v: 0, n: 0};
    shown = 0;
  } else {
    /* The device already averaged the raw stream at 11.3 Hz, which is the only
     * place averaging is free. Averaging here again across polls 1.5 s apart adds
     * waiting, not information - see AVG_N. */
    m = meanValue(s.avg_grams);
    shown = holdOrShow(m.v, s.stable);
  }
  shown = shown / u.per;
  document.getElementById('weight').textContent = shown.toFixed(u.decimals);
  document.getElementById('unit').textContent = u.label;

  setChip('chip-stable', s.stable);
  setChip('chip-zero', s.zero);
  setChip('chip-tare', s.tare);
  /* AVG lights when the device's own window is full, so the figure on screen is
     backed by a full 45 samples rather than a partly warmed-up mean. */
  setChip('chip-avg', s.avg_n >= 45);
  setChip('chip-lock', locked);

  document.getElementById('d-counts').textContent = s.counts;
  document.getElementById('d-sigma').textContent = s.sigma_mg.toFixed(0) + ' mg';
  document.getElementById('d-cal').textContent = s.cal.toFixed(2);
  document.getElementById('d-tare').textContent = s.tare_offset;
  document.getElementById('d-up').textContent =
      Math.floor(s.uptime / 60) + ' min';

  /* Auto-zero is a persistent machine state, so its button is lit while it is
     on. Without this the operator could not tell whether it was still armed -
     and the endpoint it calls turns AZT off, which used to be irreversible from
     the page. */
  var b = document.getElementById('btn-azt');
  b.classList.toggle('state-on', !!s.azt);
  b.textContent = s.azt ? 'Auto-zero on' : 'Auto-zero off';
  /* The explanation follows the state, otherwise it describes the opposite of
     what the button currently does. */
  b.dataset.tip = s.azt
      ? 'On: the zero follows the platform as it drifts'
      : 'Off: the zero stays where the tare left it';

  if (s.unit !== lastUnit) {
    lastUnit = s.unit;
    resetAverage();
    var btns = document.querySelectorAll('.units .btn');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-code') === s.unit;
      btns[i].classList.toggle('btn-primary', on);
      btns[i].classList.toggle('btn-ghost', !on);
    }
  }
}

function setChip(id, on) {
  document.getElementById(id).className = 'chip' + (on ? ' on' : '');
}

/* Never start a poll while the previous one is still in flight.
 *
 * Measured on a weak link (rssi -70..-72, 18 APs on overlapping channels): five
 * back-to-back requests came back in 0.17, 0.51, 0.93, 3.97 and 0.79 s, while an
 * idle device answered in 0.035-0.24 s. The queue was self-inflicted - each
 * pending request turns into a WiFi transmit burst, and bursts collide on a busy
 * channel. This is the same mechanism that used to corrupt the HX711 readings, so
 * piling requests up also costs measurement quality. */
var inFlight = false;

/* A request given no deadline can hang forever, and a hung request here is fatal
 * rather than merely slow.
 *
 * inFlight guards against piling requests up, and it is cleared in the last
 * .then(). But that .then() only runs when the promise settles, and on a lossy
 * link a fetch can sit without settling for as long as the browser's own
 * timeout - tens of seconds. For all of that time every 1500 ms tick returns
 * immediately at the guard above, so the page freezes on whatever it last
 * showed and never recovers even once the link comes back. From the other side
 * that is exactly "the interface does not open": the page loads, the numbers
 * never move again, and a reload seems to be the only way out.
 *
 * Measured on this link: ping loss swings between 0% and 100% over minutes
 * with nothing in the wifi log - the station stays associated and simply stops
 * getting through. Stalled requests are the normal case here, not an edge case,
 * so the deadline is mandatory rather than a nicety.
 *
 * Aborting at 4 s costs a couple of dropped readings during a bad patch, and
 * the next tick simply tries again. */
var POLL_TIMEOUT_MS = 4000;

function poll() {
  if (inFlight) return;
  inFlight = true;
  var ctl = new AbortController();
  var timer = setTimeout(function () { ctl.abort(); }, POLL_TIMEOUT_MS);
  fetch('/api/weight', {cache: 'no-store', signal: ctl.signal})
    .then(function (r) { return r.json(); })
    .then(paint)
    .catch(function () {})
    .then(function () {
      clearTimeout(timer);
      inFlight = false;
    });
}

function tare() { resetAverage(); fetch('/api/tare', {method: 'POST'}).then(poll); }

function toggleAzt() {
  var on = document.getElementById('btn-azt').classList.contains('state-on');
  fetch('/api/azt?' + (on ? 'off' : 'on'), {method: 'POST'}).then(poll);
}

function setUnit(u) {
  fetch('/api/unit?u=' + u, {method: 'POST'}).then(poll);
}

/* ------------------------------------------------------------ calibration */

function openCal() {
  var p = document.getElementById('cal-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) p.scrollIntoView({behavior: 'smooth'});
}

function toggleDiag() {
  var b = document.getElementById('diag-body');
  var t = document.getElementById('diag-toggle');
  var open = b.classList.toggle('open');
  t.setAttribute('aria-expanded', open ? 'true' : 'false');
}

/* Tooltips on the status chips.
 *
 * CSS covers hover and keyboard focus. This covers the third case, which CSS
 * cannot: a finger. The page was just fitted to a phone with no scrolling, so
 * the phone is a first-class screen here and a hover-only explanation would be
 * unreachable on exactly the device that needs it most.
 *
 * Pointer events are used rather than a click handler so that a mouse click
 * does not fight with the CSS :hover - the tap path only runs for touch, where
 * hover does not exist. Covers the status chips and the three action buttons,
 * but not every button: the unit buttons say what they do. */
(function () {
  var chips = [].slice.call(document.querySelectorAll('.chip, .has-tip'));

  function closeAll(except) {
    chips.forEach(function (c) { if (c !== except) c.classList.remove('tip-open'); });
  }

  chips.forEach(function (c) {
    c.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'mouse') return;   /* CSS :hover already handles it */
      var was = c.classList.contains('tip-open');
      closeAll(c);
      if (!was) c.classList.add('tip-open');
    });
  });

  /* Tap anywhere else closes it. Capture phase, so it runs before the chip's own
     pointerup and cannot be swallowed by stopPropagation. */
  document.addEventListener('pointerup', function (e) {
    if (!e.target.closest || !e.target.closest('.chip, .has-tip')) closeAll(null);
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAll(null);
  });
})();

var CAL_TEXT = {
  idle:      ['Ready to calibrate.', 0],
  settling:  ['Taking the tare. The platform must be empty and still.', 10],
  wait_load: ['Place the reference.', 40],
  measuring: ['Measuring the load.', 80],
  done:     ['Done.', 100],
  abort:    ['Cancelled.', 100]
};

function setCalStep(phase, text) {
  calPhase = phase;
  var t = CAL_TEXT[phase] || CAL_TEXT.idle;
  document.getElementById('cal-step').textContent = text || t[0];
  document.getElementById('cal-bar').style.width = t[1] + '%';
  document.getElementById('cal-go').disabled = (phase === 'settling' ||
      phase === 'wait_load' || phase === 'measuring');
}

function startCal(apply) {
  var mass = parseFloat(document.getElementById('cal-mass').value);
  var url = apply ? ('/api/cal/start?mass=' + mass) : '/api/cal/start';
  setCalStep('settling');
  fetch(url, {method: 'POST'})
    .then(function () { pollCal(); })
    .catch(function () { setCalStep('idle'); });
}

function calMeasureOnly() { startCal(false); }

function pollCal() {
  if (calTimer) clearTimeout(calTimer);
  fetch('/api/cal', {cache: 'no-store'})
    .then(function (r) { return r.json(); })
    .then(function (c) {
      var text = null;
      if (c.phase === 'settling') {
        text = 'Taking the tare. Elapsed ' + (c.elapsed_ms / 1000).toFixed(0) +
               ' s - the platform must be empty and still.';
      } else if (c.phase === 'measuring') {
        text = 'Measuring the load, averaging for 20 s. Do not touch the platform.';
      } else if (c.phase === 'done') {
        text = c.detail + '   delta ' + c.delta.toFixed(0) + ' counts. ' +
               'Measured ' + c.grams.toFixed(3) + ' g' +
               (c.new_cal ? ', new cal_factor ' + c.new_cal.toFixed(2) +
                           (c.saved ? ' saved' : ' (not saved)')
                          : ' - coefficient unchanged');
        poll();
      }
      setCalStep(c.phase, text);
      if (c.phase === 'settling' || c.phase === 'wait_load' ||
          c.phase === 'measuring') {
        calTimer = setTimeout(pollCal, 1000);
      }
    })
    .catch(function () {});
}

/* 1500 ms, not 400 ms. Every poll is a burst of WiFi transmit, and each burst
   raises the chance of an RF/rail disturbance reaching the HX711. Measured on an
   empty platform: polling every 100 ms corrupted 10.3% of raw samples, no HTTP
   traffic at all gave 0%. The readout stays responsive because the filter's own
   settling time is ~1-3 s, so a faster poll shows the same number more often. */
setInterval(poll, 1500);
poll();
</script>
</body>
