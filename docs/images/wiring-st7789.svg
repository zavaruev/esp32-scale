<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="760" height="420" fill="#0b1020"/>
  <text x="24" y="40" fill="#e8ecf5" font-family="sans-serif" font-size="22" font-weight="bold">GMT020-02-8P (ST7789V) to ESP32-S3</text>
  <text x="24" y="64" fill="#9aa4bb" font-family="sans-serif" font-size="13">3.3 V only - SDA/SCL are SPI, not I2C - common ground required</text>

  <g font-family="monospace" font-size="15">
    <text x="40" y="110" fill="#7fd1ff">DISPLAY PIN</text>
    <text x="280" y="110" fill="#7fd1ff">WIRE (silkscreen order)</text>
    <text x="560" y="110" fill="#7fd1ff">ESP32-S3</text>

    <line x1="40" y1="120" x2="720" y2="120" stroke="#33405e"/>

    <text x="40" y="150" fill="#e8ecf5">GND</text><text x="280" y="150" fill="#e8ecf5">black</text><text x="560" y="150" fill="#34c759">GND</text>
    <text x="40" y="180" fill="#e8ecf5">VCC</text><text x="280" y="180" fill="#e8ecf5">red</text><text x="560" y="180" fill="#34c759">3V3</text>
    <text x="40" y="210" fill="#e8ecf5">SCL</text><text x="280" y="210" fill="#e8ecf5">brown</text><text x="560" y="210" fill="#34c759">GPIO12 (SCLK)</text>
    <text x="40" y="240" fill="#e8ecf5">SDA</text><text x="280" y="240" fill="#e8ecf5">blue</text><text x="560" y="240" fill="#34c759">GPIO11 (MOSI)</text>
    <text x="40" y="270" fill="#e8ecf5">RST</text><text x="280" y="270" fill="#e8ecf5">yellow</text><text x="560" y="270" fill="#34c759">GPIO4</text>
    <text x="40" y="300" fill="#e8ecf5">DC</text><text x="280" y="300" fill="#e8ecf5">green</text><text x="560" y="300" fill="#34c759">GPIO2</text>
    <text x="40" y="330" fill="#e8ecf5">CS</text><text x="280" y="330" fill="#e8ecf5">orange</text><text x="560" y="330" fill="#34c759">GPIO10</text>
    <text x="40" y="360" fill="#e8ecf5">BL</text><text x="280" y="360" fill="#e8ecf5">white</text><text x="560" y="360" fill="#34c759">GPIO5</text>
  </g>

  <text x="24" y="402" fill="#9aa4bb" font-family="sans-serif" font-size="12">Button ribbon: rows GPIO6/GPIO7 (contacts 1/5), columns GPIO8/GPIO9/GPIO13 (contacts 2/3/4).</text>
</svg>
